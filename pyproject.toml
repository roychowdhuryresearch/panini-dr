[project]
name = "panini-dr"
version = "0.1.0"
description = "PANINI-DR: controlled deep research through Generative Semantic Workspaces"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Versions are pinned to the environment that produced the paper's runs, so the
# harness behaves the same. Only packages the shipped code imports are listed.
dependencies = [
    "httpx==0.28.1",
    "numpy==2.2.6",
    "openai==2.32.0",
    "pydantic==2.13.2",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "scipy==1.17.1",
    # The reader sizes its article window with tiktoken's o200k_base encoding.
    # Without it the reader falls back to a character heuristic, which changes
    # how much text one read shows (see REPRODUCE.md).
    "tiktoken==0.12.0",
    "typer==0.24.1",
]

[project.urls]
Paper = "https://arxiv.org/abs/2610.15208"
Homepage = "https://roychowdhuryresearch.github.io/PANINI-DR_Project_Page/"
Repository = "https://github.com/roychowdhuryresearch/panini-dr"

[project.optional-dependencies]
# Dense retrieval (Qwen3-Embedding-8B query encoder + FAISS). Needed for the
# paper configuration (retriever_type=hybrid); the encoder needs a GPU.
dense = [
    "faiss-cpu==1.13.2",
    "sentence-transformers==5.4.1",
    "torch==2.10.0",
    "transformers==4.57.6",
]
# BrowseComp-Plus lexical leg: the published Anserini/Lucene BM25 index.
# pyserini 1.2.0 needs a full JDK 21 on JAVA_HOME.
bcp = [
    "pyserini==1.2.0",
]
# Graders: Bedrock token minting for the Responses-API judge backend.
eval = [
    "aws-bedrock-token-generator==1.1.0",
    # streams the 3.3 GB BrowseComp-Plus corpus for the Obs. scorer
    "ijson==3.5.0",
]
# Benchmark preparation scripts under datasets/ (HF downloads, parquet).
datasets = [
    # BrowseComp-Plus's own decrypt_dataset.py (run by
    # `datasets/bcp/prepare.py questions --bcp-repo`) loads the queries with it
    "datasets==4.8.4",
    "huggingface-hub==0.36.2",
    "pyarrow==23.0.1",
    # decompresses the .zst corpus and dense-index files from the HF corpus repos
    "zstandard==0.25.0",
]
# Non-OpenAI-compatible LLM providers (Bedrock / Together via LiteLLM).
# The paper configuration talks to an OpenAI-compatible vLLM server and does
# not need it.
litellm = [
    "litellm==1.83.0",
]
dev = [
    "pytest==9.0.3",
]

[project.scripts]
panini-dr = "panini_dr.cli:main"

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 licence fields
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panini_dr"]

[tool.hatch.build.targets.wheel.force-include]
"configs/paper.json" = "panini_dr/_configs/paper.json"
"configs/removed_features.json" = "panini_dr/_configs/removed_features.json"
"configs/presets" = "panini_dr/_configs/presets"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.uv]
# Indirect dependencies pinned to the versions installed in the environment that
# produced the paper's runs (the rest of uv.lock was seeded from that environment's lock).
constraint-dependencies = [
    "botocore==1.43.72",
    "cffi==2.1.1",
    "cryptography==50.0.0",
    "cython==3.2.9",
    "fastapi==0.141.1",
    "idna==3.18",
    "mcp==2.0.0",
    "onnxruntime==1.29.0",
    "pillow==12.3.0",
    "pyjnius==1.7.0",
    "pyjwt==2.13.0",
    "python-multipart==0.0.32",
    "sse-starlette==3.4.8",
    "starlette==1.6.0",
    "uvicorn==0.52.3",
    "werkzeug==3.1.8",
    "httpcore2==2.10.0",
    "httpx2==2.10.0",
    "opentelemetry-api==1.44.0",
    "truststore==0.10.4",
    "xxhash==3.6.0",
]
